apiVersion: apps/v1
kind: Deployment
metadata:
  name: app7-java-teamA
  labels:
    app: app7-java-teamA
    team: TeamA
    resource-profile: large
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app7-java-teamA
  template:
    metadata:
      labels:
        app: app7-java-teamA
        team: TeamA
    spec:
      containers:
      - name: app7-java-teamA
        image: app7-java-teamA:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "1.0.0"
        - name: JAVA_OPTS
          value: "-Xmx1024m -Xms512m"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app7-java-teamA
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: app7-java-teamA
