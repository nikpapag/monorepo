apiVersion: apps/v1
kind: Deployment
metadata:
  name: app5-python-teamA
  labels:
    app: app5-python-teamA
    team: TeamA
    resource-profile: small
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app5-python-teamA
  template:
    metadata:
      labels:
        app: app5-python-teamA
        team: TeamA
    spec:
      containers:
      - name: app5-python-teamA
        image: app5-python-teamA:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app5-python-teamA
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: app5-python-teamA
