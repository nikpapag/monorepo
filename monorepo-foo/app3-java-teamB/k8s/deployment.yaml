apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-java-teamB
  labels:
    app: app3-java-teamB
    team: TeamB
    resource-profile: small
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app3-java-teamB
  template:
    metadata:
      labels:
        app: app3-java-teamB
        team: TeamB
    spec:
      containers:
      - name: app3-java-teamB
        image: app3-java-teamB:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app3-java-teamB
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: app3-java-teamB
