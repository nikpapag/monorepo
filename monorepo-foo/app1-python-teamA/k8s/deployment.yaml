apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-python-teamA
  labels:
    app: app1-python-teamA
    team: TeamA
    resource-profile: large
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-python-teamA
  template:
    metadata:
      labels:
        app: app1-python-teamA
        team: TeamA
    spec:
      containers:
      - name: app1-python-teamA
        image: app1-python-teamA:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app1-python-teamA
  labels:
    app: app1-python-teamA
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  selector:
    app: app1-python-teamA
