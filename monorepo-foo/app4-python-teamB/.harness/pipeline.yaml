pipeline:
  name: app4-python-teamB
  identifier: app4_python_teamB
  projectIdentifier: monorepo_foo
  orgIdentifier: default
  tags:
    team: TeamB
    language: python
    resource_profile: large
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: monorepo
        build: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: |
                      cd monorepo-foo/app4-python-teamB
                      pip install -r requirements.txt
                  resources:
                    limits:
                      memory: 2Gi
                      cpu: "1500m"
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    shell: Sh
                    command: |
                      cd monorepo-foo/app4-python-teamB
                      pytest --cov=. --cov-report=xml --cov-report=term
                  resources:
                    limits:
                      memory: 4Gi
                      cpu: "3000m"
