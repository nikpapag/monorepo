apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-python-teamB
  labels:
    app: app4-python-teamB
    team: TeamB
    resource-profile: large
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app4-python-teamB
  template:
    metadata:
      labels:
        app: app4-python-teamB
        team: TeamB
    spec:
      containers:
      - name: app4-python-teamB
        image: app4-python-teamB:latest
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1500m"
          limits:
            memory: "4Gi"
            cpu: "3000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app4-python-teamB
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: app4-python-teamB
